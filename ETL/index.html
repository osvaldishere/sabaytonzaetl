<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Integration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Student Data Integration System</h1>
        <p>Extract, Transform, and Load Student Records</p>
    </header>

    <section class="upload-section">
        <h2>1. Upload CSV Files</h2>

        <label>SIS - Student Information</label>
        <input type="file" id="sisFile" accept=".csv">

        <label>LMS - Learning Management System</label>
        <input type="file" id="lmsFile" accept=".csv">

        <label>Accounting - Student Accounts</label>
        <input type="file" id="accountingFile" accept=".csv">

        <button onclick="processFiles()">
            Transform and Integrate Data
        </button>
    </section>

    <section class="results">
        <h2>2. Integration Summary</h2>
        <div id="summary">No data processed yet.</div>
    </section>

    <section>
        <h2>3. Integrated JSON Output</h2>
        <pre id="jsonOutput">Your integrated JSON will appear here.</pre>

        <button onclick="downloadJSON()">
            Download Integrated JSON
        </button>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
